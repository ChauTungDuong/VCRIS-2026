services:
  database:
    image: mysql:8.0
    container_name: vcris-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root_password}
      MYSQL_DATABASE: ${DB_NAME:-vcris_db}
      MYSQL_USER: ${DB_USER:-vcris_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_db_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vcris-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vcris-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      DATABASE_URL: mysql://${DB_USER:-vcris_user}:${DB_PASSWORD:-change_me_db_password}@database:3306/${DB_NAME:-vcris_db}
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me_admin_password}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      UPLOAD_DIR: uploads
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4000/api/v1/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vcris-network

volumes:
  database_data:
  uploads_data:

networks:
  vcris-network:
    driver: bridge
