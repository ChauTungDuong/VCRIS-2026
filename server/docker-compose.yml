services:
  database:
    image: postgres:16-alpine
    container_name: vcris-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vcris_db}
      POSTGRES_USER: ${POSTGRES_USER:-vcris_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_db_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vcris-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vcris-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vcris_user}:${POSTGRES_PASSWORD:-change_me_db_password}@database:5432/${POSTGRES_DB:-vcris_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me_admin_password}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      UPLOAD_DIR: uploads
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4000/api/v1/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vcris-network

volumes:
  database_data:
    name: vcris_postgres_data
  uploads_data:
    name: vcris_backend_uploads_data

networks:
  vcris-network:
    driver: bridge
