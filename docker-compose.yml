version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: vcris-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vcris-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vcris-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vcris.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-vcris2026admin}
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      UPLOAD_DIR: uploads
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - vcris-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vcris-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vcris-network

volumes:
  mysql_data:
  uploads_data:

networks:
  vcris-network:
    driver: bridge
